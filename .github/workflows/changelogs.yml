name: Weekly changelogs

on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: weekly-changelogs
  cancel-in-progress: false

jobs:
  changelogs:
    runs-on: ubuntu-26.04
    timeout-minutes: 2
    env:
      GH_TOKEN: ${{ github.token }}
      CHANGELOG_BASE_BRANCH: ${{ github.event.repository.default_branch }}
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: commit.gpgsign
      GIT_CONFIG_VALUE_0: "false"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Test changelog generation
        run: node --test scripts/update-changelogs.test.mjs
      - name: Generate changelogs
        run: node scripts/update-changelogs.mjs
      - name: Open or update changelog PR
        uses: peter-evans/create-pull-request@v8
        with:
          branch: automation/weekly-changelogs
          delete-branch: true
          add-paths: |
            extensions/*/CHANGELOG.md
            packages/*/CHANGELOG.md
          commit-message: "docs: update weekly changelogs"
          title: "docs: update weekly changelogs"
          body: |
            Update extension and package changelogs from commits since each file's checkpoint.

            Entries contain the UTC commit date, first line of the commit message, and a link to the introducing PR when available (otherwise the commit).

            Generated by the Weekly changelogs workflow. Import and upstream provenance is preserved.
