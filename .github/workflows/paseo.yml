name: Paseo plugin
on:
  pull_request:
    paths:
      - "plugins/pi/**"
      - "integrations/paseo/**"
      - "packages/pi-presentation/**"
      - "package*.json"
      - ".github/workflows/paseo.yml"
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            plugins/pi/package-lock.json
      - run: npm ci
      - run: npm ci --prefix plugins/pi
      - run: npm run typecheck --prefix plugins/pi
      - run: npx tsc -p integrations/paseo/tsconfig.json
      - run: npm test --prefix plugins/pi
